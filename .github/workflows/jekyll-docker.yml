name: Jekyll site CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the site in the jekyll/builder container
      run: |
        docker run \
        -v ${{ github.workspace }}:/srv/jekyll -v ${{ github.workspace }}/_site:/srv/jekyll/_site \
        jekyll/builder:latest /bin/bash -c "chmod -R 777 /srv/jekyll && jekyll build --future"
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>swift sweep Uganda</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        .section { margin-bottom: 40px; border: 1px solid #ddd; padding: 15px; border-radius: 5px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; }
        input[type="text"], select { width: 100%; padding: 8px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 10px 15px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ccc; padding: 10px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>

    <div class="section">
        <h2>Book a Cleaning Service</h2>
        <form id="bookingForm">
            <label for="name">Full Name</label>
            <input type="text" id="name" required>

            <label for="address">Address</label>
            <input type="text" id="address" required>

            <label for="phone">Phone Number</label>
            <input type="text" id="phone" required>

            <label for="service">Service Type</label>
            <select id="service">
                <option value="Office Cleaning">Office Cleaning</option>
                <option value="Home Detailing">Home Detailing</option>
                <option value="Other Cleaning">Other Cleaning</option>
            </select>

            <button type="button" onclick="submitBooking()">Submit Booking</button>
        </form>
    </div>

    <div class="section">
        <h2>Management Dashboard</h2>
        <table>
            <thead>
                <tr>
                    <th>Customer Name</th>
                    <th>Service</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="dashboardBody">
                <tr>
                    <td colspan="4" style="text-align: center;">No bookings yet</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        function submitBooking() {
            const name = document.getElementById('name').value;
            const service = document.getElementById('service').value;
            
            if (!name) {
                alert('Please enter a name.');
                return;
            }

            const dashboardBody = document.getElementById('dashboardBody');
            
            if (dashboardBody.innerHTML.includes('No bookings yet')) {
                dashboardBody.innerHTML = '';
            }

            const row = document.createElement('tr');
            row.innerHTML = `
                <td>${name}</td>
                <td>${service}</td>
                <td>Pending</td>
                <td>
                    <button onclick="updateStatus(this, 'In Progress')">Start</button>
                    <button onclick="updateStatus(this, 'Completed')">Complete</button>
                </td>
            `;
            dashboardBody.appendChild(row);
            document.getElementById('bookingForm').reset();
        }

        function updateStatus(button, status) {
            const row = button.parentNode.parentNode;
            row.cells[2].textContent = status;
        }
    </script>
</body>
</html>
